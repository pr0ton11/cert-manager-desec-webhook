groupName: acme.pr0ton11.github.com

# Update the name of the secret in which the deSEC API token is stored here. 
# The secret must be in the same namespace as cert-manager.
secretName:
  - desec-token

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: ghcr.io/pr0ton11/cert-manager-desec-webhook
  tag: latest
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# -- Pod-level security context. Defaults to a non-root setup matching the
# image (which runs as uid/gid 65532). Set to null to omit the block.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. Set to null to omit the block.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Extra volumes for the deployment (e.g. a writable /tmp emptyDir when
# running with a read-only root filesystem). Set to null to omit.
extraVolumes: []

# -- Extra volume mounts for the webhook container. Set to null to omit.
extraVolumeMounts: []
